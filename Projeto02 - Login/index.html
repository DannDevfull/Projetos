<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styel.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet"> 
    <title>Tela Login</title>
</head>
<body>
    <main class="container">
        <form>
            <!--Serve para um formulário, onde se recebe informações-->
            <h1>Tela de Login </h1>
            <div class="input-box">
                <input placeholder="Usuário" type="email">
                <!--Placeholder indica informações temporárias, mas que auxiliam o usuário-->
                <!--O type do input é importante pois ajuda o navegador saber que tipo de informação deve ser colocada alí.-->
                <img src="IMG/imguser.svg" class="icon" alt="Silhueta de uma pessoa">
            </div>

            <div class="input-box">
                <input placeholder="Senha" type="password">
                <img src="IMG/imgblock.svg" class="icon" alt="Silhueta de uma cadeado">
            </div>

            <div class="remember">
                <label>
                    <input type="checkbox">
                     Lembrar senha
                    <!--O label é o texto que acompanha o caixa de seleção. Devemos usar o semantismo do HTML5.-->
                </label>
                <a href="#">Esqueci a senha</a>
            </div>
            
            <button type="submit" class="login">Login</button>

            <div class="register">
                <p>Não tem uma conta? <a href="#">Cadastre-se</a></p>
            </div>
        </form>
    </main>
</body>
</html>
